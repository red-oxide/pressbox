[package]
description            = "Shared API types for pressbox"
edition.workspace      = true
license                = "GPL-3.0-only"
name                   = "pressbox-api"
publish                = false
repository.workspace   = true
rust-version.workspace = true
version.workspace      = true

[lints]
workspace = true

[dependencies]
serde  = { version = "1.0.229", features = ["derive"] }
utoipa = { version = "6.0.0", optional = true }

[features]
# OpenAPI schemas for these types (utoipa's `ToSchema`), for pressboxd's
# generated API description; the clients don't need them.
openapi = ["dep:utoipa"]
